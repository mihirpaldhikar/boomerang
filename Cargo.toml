[workspace]
resolver = "3"
members = [
    "bin/boomerang",
    "crates/database",
    "crates/http",
    "crates/http/macros",
    "crates/yamlite",
    "crates/yamlite/macros",
]

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
lto = "fat"
codegen-units = 1
panic = "abort"
split-debuginfo = "off"

[workspace.dependencies]
# Local Crates
database = { path = "crates/database" }
http = { path = "crates/http" }
yamlite = { path = "crates/yamlite" }

chrono = { version = "0.4.45" }
rust_decimal = { version = "1.42.1" }
uuid = { version = "1.29.3", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
ahash = { version = "0.8.12" }
hashbrown = { version = "0.17.1" }
parking_lot = { version = "0.13.0" }
rustc-hash = { version = "2.1.3" }
criterion = { version = "0.8.2", features = ["html_reports"] }
sqlx = { version = "0.9.1", features = ["postgres", "runtime-tokio", "sqlite"] }
futures = { version = "0.3.34" }
tokio = { version = "1.54.1", features = ["full"] }
tempfile = { version = "3.27.0" }
clap = { version = "4.6.7", features = ["derive"] }
thiserror = { version = "2.0.21", default-features = false }
memchr = { version = "2.8.3" }
bytes = { version = "1.12.2" }
async-compression = { version = "0.4.52", features = ["tokio", "gzip", "brotli", "zstd"] }
tokio-rustls = { version = "0.26.6" }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = { version = "2.2.0" }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
socket2 = { version = "0.6.5" }
libc = { version = "0.2.191" }
aws-lc-rs = { version = "1.19.0" }
webpki-roots = { version = "1.0.12" }
base64 = { version = "0.23.1" }

# Macro Helpers
proc-macro2 = { version = "1.0.107" }
quote = { version = "1.0.47" }
syn = { version = "3.0.10", features = ["full"] }
proc-macro-crate = { version = "3.5.0" }

# Allocator
mimalloc = { version = "0.1.52" }
