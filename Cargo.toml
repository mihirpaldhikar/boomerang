[workspace]
resolver = "3"
members = ["bin/boomerang"]

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
lto = "off"
opt-level = 3
codegen-units = 1

[workspace.dependencies]
# Allocator
mimalloc = { version = "0.1.52", features = ["secure"] }
